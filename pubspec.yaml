name: victor_project
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  
  flutter_localizations:
    sdk: flutter
  
  # Database
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.4.2
  path: ^1.8.3
  path_provider: ^2.1.0
  
  # State Management
  provider: ^6.0.5
  shared_preferences: ^2.1.1
  
  # Date & Time
  intl: ^0.20.2
  
  # PDF & Printing
  printing: ^5.11.1
  pdf: ^3.10.4
  
  # Image Picker
  image_picker: ^1.0.4
  
  # Charts
  fl_chart: ^0.63.0
  
  # UI & Icons
  cupertino_icons: ^1.0.8
  persian: ^1.0.0
  
  # Excel Import/Export
  excel: ^4.0.4
  file_picker: ^6.1.1
  file_selector: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/companylogo.png
    - assets/fonts/
  fonts:
    - family: Vazir
      fonts:
        - asset: assets/fonts/Vazirmatn-Thin.ttf
          weight: 100
        - asset: assets/fonts/Vazirmatn-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Vazirmatn-Light.ttf
          weight: 300
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Vazirmatn-Black.ttf
          weight: 900